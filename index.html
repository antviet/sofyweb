<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benvenute!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #ec4899,
                #f59e0b
            );
        }

        .card {
            width: min(90%, 760px);
            padding: 55px 35px;
            text-align: center;

            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 28px;

            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.22);

            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: clamp(2.2rem, 7vw, 4.5rem);
            margin: 0 0 18px;
        }

        h2 {
            font-size: clamp(1.3rem, 4vw, 2rem);
            margin: 0 0 24px;
            font-weight: 500;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
            max-width: 600px;
            margin: auto;
        }

        .names {
            color: #fff7b2;
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            margin-top: 30px;
            padding: 11px 20px;

            border-radius: 30px;

            background: white;
            color: #7c3aed;

            font-weight: bold;
        }
    </style>
</head>

<body>

    <main class="card">

        <h1>👋 Benvenute!</h1>

        <h2>
            <span class="names">
                Merivalente, Sofy e Maya
            </span>
            ✨
        </h2>

        <p>
            Questa è la nostra <strong>pagina di prova</strong>
            per imparare, sperimentare e divertirci
            a creare siti web con HTML e CSS.
        </p>

        <div class="badge">
            🚀 Il nostro primo sito web
        </div>

    </main>

</body>
</html>
